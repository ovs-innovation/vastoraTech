services:
  backend:
    build:
      context: ./backend
    container_name: vastora-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8081:8081"

  frontend:
    build:
      context: ./frontend
    container_name: vastora-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "5050:5050"
    depends_on:
      - backend

  admin:
    build:
      context: ./admin
    container_name: vastora-admin
    restart: unless-stopped
    ports:
      - "4100:80"
    depends_on:
      - backend
